<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petrolifex - Sign Up</title>
    <style>
        /* --- ĐÂY LÀ ĐOẠN CSS MỚI BẠN VỪA GỬI --- */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #1e1e1e; /* Đổi màu nền ngoài thành màu tối cho hợp với form */
            font-family: system-ui, -apple-system, sans-serif;
        }

        .form {
          --input-focus: #2d8cf0;
          --font-color: #fefefe;
          --font-color-sub: #7e7e7e;
          --bg-color: #111;
          --main-color: #fefefe;
          padding: 20px;
          background: var(--bg-color);
          display: flex;
          flex-direction: column;
          align-items: flex-start;
          justify-content: center;
          gap: 20px;
          border-radius: 5px;
          border: 2px solid var(--main-color);
          box-shadow: 4px 4px var(--main-color);
        }

        .title {
          color: var(--font-color);
          font-weight: 900;
          font-size: 20px;
          margin-bottom: 25px;
        }

        .title span {
          color: var(--font-color-sub);
          font-weight: 600;
          font-size: 17px;
        }

        .input {
          width: 250px;
          height: 40px;
          border-radius: 5px;
          border: 2px solid var(--main-color);
          background-color: var(--bg-color);
          box-shadow: 4px 4px var(--main-color);
          font-size: 15px;
          font-weight: 600;
          color: var(--font-color);
          padding: 5px 10px;
          outline: none;
        }

        .input::placeholder {
          color: var(--font-color-sub);
          opacity: 0.8;
        }

        .input:focus {
          border: 2px solid var(--input-focus);
        }

        .login-with {
          display: flex;
          gap: 20px;
        }

        .button-log {
          cursor: pointer;
          width: 40px;
          height: 40px;
          border-radius: 100%;
          border: 2px solid var(--main-color);
          background-color: var(--bg-color);
          box-shadow: 4px 4px var(--main-color);
          color: var(--font-color);
          font-size: 25px;
          display: flex;
          justify-content: center;
          align-items: center;
        }

        .icon {
          width: 24px;
          height: 24px;
          fill: var(--main-color);
        }

        .button-log:active, .button-confirm:active {
          box-shadow: 0px 0px var(--main-color);
          transform: translate(3px, 3px);
        }

        .button-confirm {
          margin: 50px auto 0 auto;
          width: 120px;
          height: 40px;
          border-radius: 5px;
          border: 2px solid var(--main-color);
          background-color: var(--bg-color);
          box-shadow: 4px 4px var(--main-color);
          font-size: 17px;
          font-weight: 600;
          color: var(--font-color);
          cursor: pointer;
        }
    </style>
</head>
<body>

    <form class="form">
      <div class="title">Welcome,<br><span>sign up to continue</span></div>
      <input type="email" placeholder="Email" name="email" class="input">
      <input type="password" placeholder="Password" name="password" class="input">
      <div class="login-with">
        <div class="button-log"></div>
        </div>
      </div>
      <button class="button-confirm">Login</button>
    </form>

</body>
</html>
