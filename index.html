<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petrolifex - Login</title>
    <style>
        /* --- TỐI ƯU TOÀN BỘ GIAO DIỆN --- */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: rgb(10, 10, 10);
            font-family: system-ui, -apple-system, sans-serif;
        }

        /* Vùng chứa Canvas chạy nền */
        #canvas-container {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1; /* Nằm dưới cùng */
        }

        #bg-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Căn giữa Form đè lên trên nền động */
        .wrapper {
            position: absolute;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2; /* Nằm đè lên Canvas */
            pointer-events: none; /* Tránh cản chuột tương tác với nền */
        }

        .form {
          --input-focus: #2d8cf0;
          --font-color: #fefefe;
          --font-color-sub: #7e7e7e;
          --bg-color: rgba(17, 17, 17, 0.9); /* Làm trong suốt nhẹ để thấy nền chạy phía sau */
          --main-color: #fefefe;
          padding: 30px;
          background: var(--bg-color);
          display: flex;
          flex-direction: column;
          align-items: flex-start;
          justify-content: center;
          gap: 20px;
          border-radius: 5px;
          border: 2px solid var(--main-color);
          box-shadow: 4px 4px var(--main-color);
          pointer-events: auto; /* Cho phép nhập liệu form bình thường */
          backdrop-filter: blur(5px); /* Làm mờ hiệu ứng phía sau form */
        }
